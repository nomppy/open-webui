name: open-webui-dev-local

services:
  searxng:
    image: searxng/searxng:latest
    pull_policy: always
    ports:
      - "8081:8080"
    volumes:
      - ./searxng:/etc/searxng
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    environment:
      - REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
      - SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
    restart: always
    profiles: [search]

  pipelines:
    extends:
      file: pipelines/compose.yaml
      service: pipelines
    entrypoint: ["bash", "dev.sh"]
    env_file: ".env.dev"

  frontend:
    build:
      context: .
      target: development
    command: ["npm", "run", "dev"]
    depends_on:
      - backend
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "3000:5173"
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: rebuild
          path: package.json

  backend:
    build:
      context: .
      target: dev
      args:
        USE_CUDA: false
        USE_OLLAMA: false
    command: ["bash", "dev.sh"]
    env_file: ".env.dev"
    volumes:
      - data:/app/backend/data
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "8080:8080"
    restart: always
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app/backend
          ignore:
            - backend/data
        - action: rebuild
          path: backend/requirements.txt
  # ollama:
  #   volumes:
  #     - ollama:/root/.ollama
  #   container_name: ollama
  #   pull_policy: missing
  #   tty: true
  #   restart: unless-stopped
  #   image: ollama/ollama:${OLLAMA_DOCKER_TAG-latest}
  #   profiles: [full]

volumes:
  data: {}
